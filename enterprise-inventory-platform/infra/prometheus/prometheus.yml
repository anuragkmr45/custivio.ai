global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "enterprise-inventory-web"
    metrics_path: /api/metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
