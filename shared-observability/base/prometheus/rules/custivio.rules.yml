groups:
  - name: custivio
    rules:
      - alert: InventoryApiDown
        expr: up{software="custivio",role="api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Custivio API is down
      - alert: InventoryWorkerDeadLetterJobs
        expr: inventory_worker_dead_letter_jobs_total > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Inventory worker has dead-letter jobs
